[project]
name = "aipm-backend"
version = "0.1.0"
description = "AI Project Management Platform — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "saq[postgres,web]>=0.26.4",
    "psycopg[binary]>=3.2",
    "google-genai>=2.19,<3.0",
    "ollama==0.6.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-ollama>=0.3",
    "pdfplumber>=0.11.10",
    "pypdf>=6.16",
    "docx2python>=3.1",
    "python-docx>=1.2.0",
    "mammoth>=1.12.1",
    "html-for-docx>=1.2.0",
    "playwright>=1.62",
    "jinja2>=3.1",
    "bleach>=6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
